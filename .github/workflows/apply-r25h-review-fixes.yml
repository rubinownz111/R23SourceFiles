name: Apply focused R25h review fixes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/r25h-review-findings'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          scripts_path = Path("CommunityPatch/scripts/data/scripts.lua")
          text = scripts_path.read_text(encoding="utf-8")

          # Make retries harmless after the patch commit triggers synchronize.
          if "bannerExperienceLvlString" in text:
              print("Focused fixes are already present; no source rewrite needed.")
          else:
              def replace_once(source: str, old: str, new: str, label: str) -> str:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f"{label}: expected exactly one match, found {count}")
                  return source.replace(old, new, 1)

              # Preserve the maintainer's new nil-safe ApplyXPModifier implementation.
              required_upstream_guard = "if upgrades[timesPromoted] then"
              if required_upstream_guard not in text:
                  raise SystemExit("expected upstream ApplyXPModifier guard is missing")

              text = replace_once(
                  text,
                  'experienceLvlString = "GDIZoneTrooperSquadExperienceLevel_", isAirborne = false, isAirborne = false',
                  'experienceLvlString = "GDIZoneTrooperSquadExperienceLevel_", isAirborne = false',
                  "duplicate GDIZoneTrooper isAirborne flag",
              )

              banner_prefixes = {
                  "GDIZoneTrooperSquadExperienceLevel_": ("GDIZoneTrooperGarrisonedExperienceLevel_", 2),
                  "GDIRifleSoldierSquadExperienceLevel_": ("GDIRifleSoldierGarrisonedExperienceLevel_", 2),
                  "GDIGrenadeSoldierSquadExperienceLevel_": ("GDIGrenadeSoldierGarrisonedExperienceLevel_", 1),
                  "GDIMissileSoldierSquadExperienceLevel_": ("GDIMissileSoldierGarrisonedExperienceLevel_", 2),
                  "ZOCOMZoneRaiderSquadExperienceLevel_": ("ZOCOMZoneRaiderGarrisonedExperienceLevel_", 2),
                  "ZOCOMRifleSoldierSquadExperienceLevel_": ("ZOCOMRifleSoldierGarrisonedExperienceLevel_", 2),
                  "ZOCOMGrenadeSoldierSquadExperienceLevel_": ("ZOCOMGrenadeSoldierGarrisonedExperienceLevel_", 1),
                  "ZOCOMMissileSoldierSquadExperienceLevel_": ("ZOCOMMissileSoldierGarrisonedExperienceLevel_", 2),
                  "SteelTalonsRifleSoldierSquadExperienceLevel_": ("SteelTalonsRifleSoldierGarrisonedExperienceLevel_", 2),
                  "SteelTalonsGrenadeSoldierSquadExperienceLevel_": ("SteelTalonsGrenadeSoldierGarrisonedExperienceLevel_", 1),
                  "SteelTalonsMissileSoldierSquadExperienceLevel_": ("SteelTalonsMissileSoldierGarrisonedExperienceLevel_", 2),
                  "MutantMarauderSquadExperienceLevel_": ("MutantMarauderGarrisonedExperienceLevel_", 1),
              }

              for normal_prefix, (banner_prefix, expected_count) in banner_prefixes.items():
                  marker = f'experienceLvlString = "{normal_prefix}"'
                  count = text.count(marker)
                  if count != expected_count:
                      raise SystemExit(
                          f"{normal_prefix}: expected {expected_count} metadata entries, found {count}"
                      )
                  text = text.replace(
                      marker,
                      marker + f', bannerExperienceLvlString = "{banner_prefix}"',
                  )

              # Only the temporary Hammerhead leader uses the zero-XP banner templates.
              leader_start = text.index("function GarrisonedInHammerhead(self)")
              leader_end = text.index("\nfunction GarrisonedInHammerheadEnd(self)", leader_start)
              leader_block = text[leader_start:leader_end]
              if leader_block.count("squadData.experienceLvlString") != 2:
                  raise SystemExit("unexpected Hammerhead leader experience-prefix layout")
              leader_block = leader_block.replace(
                  "squadData.experienceLvlString",
                  "squadData.bannerExperienceLvlString",
              )
              leader_block = leader_block.replace("squadLevelString", "bannerLevelString")
              text = text[:leader_start] + leader_block + text[leader_end:]

              # Validate squad metadata before dereferencing it and reuse the same record.
              exit_start = text.index("function OnSquadExitRax_R24(self, isHealed)")
              exit_end = text.index("\nfunction isSquadExploit", exit_start)
              exit_block = text[exit_start:exit_end]
              exit_block = replace_once(
                  exit_block,
                  "if squadSize == 0 then return end",
                  "if squadData == nil or squadSize == 0 then return end",
                  "OnSquadExitRax metadata guard",
              )
              exit_block = replace_once(
                  exit_block,
                  "isSquadExploit(squad)",
                  "isSquadExploit(squad, squadData)",
                  "OnSquadExitRax exploit call",
              )
              text = text[:exit_start] + exit_block + text[exit_end:]

              exploit_start = text.index("function isSquadExploit")
              exploit_end = text.index("\n-- horde member killed", exploit_start)
              exploit_block = text[exploit_start:exploit_end]
              exploit_block = replace_once(
                  exploit_block,
                  "function isSquadExploit(squad)",
                  "function isSquadExploit(squad, squadData)",
                  "isSquadExploit signature",
              )
              exploit_block = replace_once(
                  exploit_block,
                  "if squad == nil then return end",
                  "if squad == nil or squadData == nil then return end",
                  "isSquadExploit guard",
              )
              lookup = "squadSizeTable[tostring(getObjectName(squad.selfRef))].size"
              if lookup not in exploit_block:
                  raise SystemExit("isSquadExploit metadata lookup not found")
              exploit_block = exploit_block.replace(lookup, "squadData.size")
              text = text[:exploit_start] + exploit_block + text[exploit_end:]

              # Ignore late upgrade events after SAGE has already removed squad state.
              grant_start = text.index("function GrantUpgradesToLeader(squad)")
              grant_end = text.index("\n-- triggered by +RIDER4", grant_start)
              grant_block = text[grant_start:grant_end]
              grant_block = replace_once(
                  grant_block,
                  "function GrantUpgradesToLeader(squad)\n",
                  "function GrantUpgradesToLeader(squad)\n\tif squad == nil then return end\n\tlocal squadData = squadSizeTable[getObjectName(squad.selfRef)]\n\tif squadData == nil then return end\n",
                  "GrantUpgradesToLeader guard",
              )
              grant_block = replace_once(
                  grant_block,
                  "local isZoneRaiderSquad = squadSizeTable[getObjectName(squad.selfRef)].needsRocketFix",
                  "local isZoneRaiderSquad = squadData.needsRocketFix",
                  "GrantUpgradesToLeader metadata reuse",
              )
              text = text[:grant_start] + grant_block + text[grant_end:]

              upgraded_start = text.index("function SquadHasBeenUpgraded(self)")
              upgraded_end = text.index("\nfunction OnSquadDestroyed_R24", upgraded_start)
              upgraded_replacement = '''function SquadHasBeenUpgraded(self)
          \t--print("unit upgraded")
          \tlocal _,squadMember = GetSquadMemberAttributes(self)
          \tif squadMember.squadObject == nil then return end
          \tlocal squad = squadTables[squadMember.squadObject]
          \tif squad == nil then return end
          \tGrantUpgradesToLeader(squad)
          end
          '''
              text = text[:upgraded_start] + upgraded_replacement + text[upgraded_end:]

              scripts_path.write_text(text, encoding="utf-8")

          # Restore the Ion Cannon object to the path already included by GDI.xml.
          ion_source = Path("CommunityPatch/Data/IonCannonEffect.xml")
          ion_target = Path("CommunityPatch/Data/GDI/IonCannonEffect.xml")
          if ion_source.exists() and not ion_target.exists():
              ion_source.replace(ion_target)
          elif not ion_source.exists() and ion_target.exists():
              pass
          else:
              raise SystemExit("expected exactly one IonCannonEffect source path")

          final_text = scripts_path.read_text(encoding="utf-8")
          assertions = [
              "if upgrades[timesPromoted] then",
              "bannerExperienceLvlString",
              "squadData.bannerExperienceLvlString",
              "if squadData == nil or squadSize == 0 then return end",
              "function isSquadExploit(squad, squadData)",
              "local isZoneRaiderSquad = squadData.needsRocketFix",
              "if squadMember.squadObject == nil then return end",
          ]
          for marker in assertions:
              if marker not in final_text:
                  raise SystemExit(f"post-patch assertion failed: {marker}")

          banner_xml = Path(
              "CommunityPatch/Data/GlobalData/ExperienceLevelsR25Banners.xml"
          ).read_text(encoding="utf-8")
          for banner_prefix, _ in banner_prefixes.values():
              if f'id="{banner_prefix}1"' not in banner_xml:
                  raise SystemExit(f"missing banner template: {banner_prefix}1")
          PY

      - name: Validate XML and commit
        shell: bash
        run: |
          set -euo pipefail

          test -f CommunityPatch/Data/GDI/IonCannonEffect.xml
          test ! -e CommunityPatch/Data/IonCannonEffect.xml
          grep -F '<Include source="IonCannonEffect.xml" type="all"/>' CommunityPatch/Data/GDI/GDI.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in (
              "CommunityPatch/Data/GDI/IonCannonEffect.xml",
              "CommunityPatch/Data/GDI/GDI.xml",
              "CommunityPatch/Data/GlobalData/ExperienceLevelsR25Banners.xml",
          ):
              ET.parse(path)
          PY

          git diff --check
          if git diff --quiet; then
            echo "No additional changes to commit."
            exit 0
          fi

          git config user.name "Rubin Shkalla"
          git config user.email "199379259+rubinownz111@users.noreply.github.com"
          git add CommunityPatch/scripts/data/scripts.lua \
                  CommunityPatch/Data/GDI/IonCannonEffect.xml \
                  CommunityPatch/Data/IonCannonEffect.xml
          git commit -m "Fix Hammerhead banner XP and squad event safety"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
